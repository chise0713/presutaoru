name: Tests

on:
  workflow_call:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/tests.yml"

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo registry, index, and targets
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "cargo"
      - name: Run unit tests
        run: cargo test --lib --all-features --verbose
        shell: bash
      - name: Run integration test
        run: |
          exe=$(cargo test --test integration --no-run --message-format json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable? != null) | .executable')

          if [ -z "$exe" ]; then
            echo "executable not found"
            exit 1
          fi

          sudo "$exe"
        shell: bash
