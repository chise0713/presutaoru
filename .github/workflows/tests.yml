name: Tests

on:
  workflow_call:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/tests.yml"

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry, index, and targets
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: "cargo"
      - name: Run unit tests
        run: cargo test --lib --all-features --verbose
        shell: bash
      - name: Run integration test
        run: |
          exe=$(cargo test --test integration --no-run --message-format json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable? != null) | .executable')

          if [ -z "$exe" ]; then
            echo "executable not found"
            exit 1
          fi

          sudo "$exe"
        shell: bash
